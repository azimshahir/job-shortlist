name: Daily job shortlist

# WHY THIS RUNS ON ACTIONS AND NOT ON VERCEL OR IN THE CLAUDE CLOUD ROUTINE
#   Vercel has no torch and a 10s limit; the Claude cloud sandbox's egress
#   proxy returns 403 for linkedin.com and indeed.com. GitHub runners can
#   scrape. So: Actions scrapes, writes runs / jobs / job_scores to Supabase
#   (SINK=supabase) and reads cross-run history from the same tables
#   (HISTORY_BACKEND=supabase). shortlist.md is still committed as the daily
#   record for the /jobs chat command; job_history.db is no longer used.
#
#   The user never needs to open GitHub -- the dashboard's "Scrape sekarang"
#   button fires workflow_dispatch on this file.

on:
  schedule:
    # 23:40 UTC = 07:40 MYT, so the report is committed before the Claude
    # routine reads it at ~08:15 MYT. Off the top of the hour on purpose.
    - cron: "40 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # needed to push shortlist.md

env:
  SINK: supabase
  HISTORY_BACKEND: supabase
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: daily-shortlist
      cancel-in-progress: false

    defaults:
      run:
        working-directory: scraper

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('scraper/config.py') }}
          restore-keys: hf-

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt

      - name: Run tests
        run: |
          python test_filters.py
          python test_pipeline.py
          python test_careers.py
          python test_history.py
          python test_sink.py

      - name: Run pipeline
        # SINK / HISTORY_BACKEND come from the job env above. sink.py fails
        # loudly before scraping if any SUPABASE_* secret is missing.
        run: python pipeline.py --quiet --sink supabase

      - name: Show report in job summary
        if: always()
        run: cat shortlist.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit report back to main
        if: always()
        run: |
          git config user.name  "job-shortlist-bot"
          git config user.email "bot@job-shortlist"
          git add shortlist.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Daily shortlist $(date -u +%Y-%m-%d)"
          # main may have moved (user pushed a rule change); rebase then push.
          git pull --rebase origin main
          git push origin main

      - name: Upload stage CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stages-${{ github.run_number }}
          path: |
            scraper/raw_jobs.csv
            scraper/filtered_jobs.csv
            scraper/ranked_jobs.csv
            scraper/final_jobs.csv
            scraper/shortlist.md
          if-no-files-found: warn
          retention-days: 14
