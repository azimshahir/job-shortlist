name: Job shortlist (manual)

# No schedule and no email: the user runs the pipeline from chat with /jobs.
# This workflow exists only as a CI check and an on-demand artifact producer.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["*.py", "candidate_profile.yaml", "requirements.txt"]

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config.py') }}
          restore-keys: hf-

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt

      - name: Run tests
        run: |
          python test_filters.py
          python test_pipeline.py
          python test_careers.py
          python test_history.py

      - name: Run pipeline (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: python pipeline.py

      - name: Show report in job summary
        if: github.event_name == 'workflow_dispatch' && always()
        run: cat shortlist.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload stage CSVs
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v4
        with:
          name: stages-${{ github.run_number }}
          path: |
            raw_jobs.csv
            filtered_jobs.csv
            ranked_jobs.csv
            final_jobs.csv
            shortlist.md
          if-no-files-found: warn
          retention-days: 14
