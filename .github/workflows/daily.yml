name: Daily job shortlist

# WHY THIS RUNS ON ACTIONS AND NOT IN THE CLAUDE CLOUD ROUTINE
#   The Claude cloud sandbox's egress proxy returns 403 for linkedin.com and
#   indeed.com, so it cannot scrape. GitHub runners can. So: Actions scrapes
#   and commits shortlist.md + job_history.db back to main; the Claude routine
#   then only reads shortlist.md from the repo and presents it.
#
#   The user never needs to open GitHub -- this is plumbing.

on:
  schedule:
    # 23:40 UTC = 07:40 MYT, so the report is committed before the Claude
    # routine reads it at ~08:15 MYT. Off the top of the hour on purpose.
    - cron: "40 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # needed to push shortlist.md and job_history.db

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: daily-shortlist
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config.py') }}
          restore-keys: hf-

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt

      - name: Run tests
        run: |
          python test_filters.py
          python test_pipeline.py
          python test_careers.py
          python test_history.py

      - name: Run pipeline
        run: python pipeline.py --quiet

      - name: Show report in job summary
        if: always()
        run: cat shortlist.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit report and history back to main
        if: always()
        run: |
          git config user.name  "job-shortlist-bot"
          git config user.email "bot@job-shortlist"
          git add shortlist.md job_history.db
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Daily shortlist $(date -u +%Y-%m-%d)"
          # main may have moved (user pushed a rule change); rebase then push.
          git pull --rebase origin main
          git push origin main

      - name: Upload stage CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stages-${{ github.run_number }}
          path: |
            raw_jobs.csv
            filtered_jobs.csv
            ranked_jobs.csv
            final_jobs.csv
            shortlist.md
          if-no-files-found: warn
          retention-days: 14
